name: Release

# Tag push (v<version>): build every installer on its own OS, then publish one GitHub Release with all of them.
# Manual run or release-check: build everything and stop before publishing (a dry run).
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  check:
    name: Check tag, changelog, and Publisher tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build Publisher
        run: dotnet build src/Termrig.Publisher -c Release
      - name: Verify tag matches version and changelog
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel verify-release --tag "${{ github.ref_name }}"
      - name: Publisher tests
        run: dotnet test src/Test.Publisher -c Release --verbosity minimal
      - name: Show channels
        run: dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel list

  windows:
    name: Windows installers
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Publisher
        run: dotnet build src/Termrig.Publisher -c Release
      - name: Publish, zip, and Inno Setup
        run: dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel publish,zip,inno
      - name: Check the portable zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem installers/*/termrig-*-win-x64.zip | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $names = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName).Entries.FullName
          $names
          foreach ($expected in 'Termrig.exe', 'trig.cmd', 'LICENSE.txt') { if ($names -notcontains $expected) { throw "$($zip.Name) is missing $expected" } }
      - uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: installers/
          if-no-files-found: error
          compression-level: 0

  macos:
    name: macOS installers
    needs: check
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Build Publisher
        run: dotnet build src/Termrig.Publisher -c Release
      - name: Publish, sign ad-hoc, and package
        run: dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel publish,app,tarball,pkg,dmg
      - name: Check the ad-hoc signature
        run: |
          app="$(find artifacts/publisher -path '*osx-arm64/app/Termrig.app' -maxdepth 6 | head -n 1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --verbose=4 "$app" 2>&1 | tee spctl.txt || true
          if grep -qiE 'damaged|invalid signature' spctl.txt; then echo 'The ad-hoc signature is broken; users would see the "damaged" dead end.'; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: installers-macos
          path: installers/
          if-no-files-found: error
          compression-level: 0

  linux:
    name: Linux installers
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - name: Install packaging tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update
          sudo -E apt-get install -y rpm ruby ruby-dev build-essential desktop-file-utils file xvfb xauth
          sudo gem install --no-document fpm
          sudo curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: Build Publisher
        run: dotnet build src/Termrig.Publisher -c Release
      - name: Publish and package
        run: dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel publish,tarball,deb,rpm,appimage
      - name: Inspect packages
        run: |
          dpkg-deb --info installers/*/termrig_*_amd64.deb
          dpkg-deb --contents installers/*/termrig_*_amd64.deb
          rpm -qip installers/*/termrig-*.x86_64.rpm
          rpm -qlp installers/*/termrig-*.x86_64.rpm
          desktop-file-validate artifacts/publisher/*/linux/linux-x64/root/usr/share/applications/ai.latticetech.termrig.desktop
      - name: Install the .deb and start Termrig
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get install -y ./installers/*/termrig_*_amd64.deb
          test "$(readlink -f "$(command -v trig)")" = /opt/termrig/Termrig
          # Termrig is a desktop app: start it under a virtual display and require it to still be running after 20 s.
          status=0
          xvfb-run -a timeout 20 env TERMRIG_FOREGROUND=1 /opt/termrig/Termrig || status=$?
          if [ "$status" -ne 124 ]; then echo "Termrig exited early with status $status"; ls -la ~/.termrig/crashes 2>/dev/null && cat ~/.termrig/crashes/* 2>/dev/null; exit 1; fi
          if ls ~/.termrig/crashes/*.log >/dev/null 2>&1; then cat ~/.termrig/crashes/*.log; exit 1; fi
          sudo -E apt-get remove -y termrig
          test ! -e /usr/bin/trig
      - uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: installers/
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    needs: [ windows, macos, linux ]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: installers/
          merge-multiple: true
      - name: Build Publisher
        run: dotnet build src/Termrig.Publisher -c Release
      - name: Verify tag, changelog, and every platform's files
        id: verify
        run: |
          dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel verify-release --tag "${{ github.ref_name }}"
          dotnet run --project src/Termrig.Publisher -c Release --no-build -- --channel checksums,verify-assets,notes --notes-output release-notes.md
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ steps.verify.outputs.name }}
          body_path: release-notes.md
          prerelease: ${{ steps.verify.outputs.prerelease == 'true' }}
          make_latest: ${{ steps.verify.outputs.prerelease == 'true' && 'false' || 'true' }}
          draft: false
          fail_on_unmatched_files: true
          files: installers/${{ steps.verify.outputs.version }}/*
